<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#630000">
    <title>PREVIA — Vintage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- =========================================
     PREVIA APP
========================================= -->

<!-- existing page markup -->

<div id="app">

<div id="categories">

<div class="card" id="watches-count" onclick="showWatches()"></div>
<div class="card" id="jewelry-count" onclick="showJewelry()"></div>
<div class="card" id="new-count" onclick="showNewProducts()"></div>

<div class="card" onclick="showComingSoon('GLASSES')">
    <div class="category-title">GLASSES</div>
</div>

<div class="card" onclick="showComingSoon('APPAREL')">
    <div class="category-title">APPAREL</div>
</div>

<div class="card" onclick="showComingSoon('ARTWORK')">
    <div class="category-title">ART</div>
</div>

<div class="card" onclick="showComingSoon('DECOR')">
    <div class="category-title">DECOR</div>
</div>

<div class="card" onclick="showSale()">
    <div class="category-title">SALE</div>
</div>

</div>

<div id="home-new-products"></div>
<div id="content"></div>

</div>

<div id="search-screen">
    <div id="search-message">Пошук за назвою, брендом або SKU.</div>
    <div id="search-suggestions"></div>
    <div id="search-results"></div>
</div>

<button id="scrollTopBtn" onclick="scrollToTop()"></button>

<button id="backBtn" onclick="handleBackButton">←</button>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span id="lightboxClose" class="close-lightbox" onclick="event.stopPropagation(); closeLightbox()"></span>
    <img id="lightbox-image" class="lightbox-image" src="" alt="" onclick="event.stopPropagation()">
    <button id="lightboxPrev" class="lightbox-prev" onclick="event.stopPropagation(); previousImage()"></button>
    <button id="lightboxNext" class="lightbox-next" onclick="event.stopPropagation(); nextImage()"></button>
</div>

<div id="toast"></div>

<div id="cart-modal" class="cart-modal" onclick="if (event.target === this) Cart.close()">
    <div class="cart-window" role="dialog" aria-modal="true" aria-labelledby="cart-title">
        <div class="cart-header">
            <h2 id="cart-title">КОШИК</h2>
            <button class="cart-close" type="button" onclick="Cart.close()">×</button>
        </div>
        <div id="cart-empty">Кошик порожній.</div>
        <div id="cart-items"></div>
        <div id="cart-summary" class="cart-summary" hidden>
            <div>Разом</div>
            <div id="cart-total" class="cart-total"></div>
            <button type="button" onclick="Cart.checkout()">ОФОРМИТИ</button>
        </div>
    </div>
</div>

<!-- =========================================
     JavaScript Modules
========================================= -->

<script src="data.js"></script>
<script src="Cart.js"></script>
<script src="config.js"></script>
<script src="search.js"></script>
<script src="navigation.js"></script>
<script src="gallery.js"></script>
<script src="product.js"></script>
<script src="OrderModal.js"></script>
<!-- OrderClient + OrderIntegration are the real checkout path. -->
<script src="OrderClient.js"></script>
<script src="OrderIntegration.js"></script>
<script src="related.js"></script>
<script src="card.js"></script>
<script src="icons.js"></script>
<script src="share.js"></script>
<script src="toast.js"></script>
<script src="catalog.js"></script>
<script src="home.js"></script>
<script src="FavoritesStorage.js"></script>
<script src="LocalFavoritesStorage.js"></script>
<script src="CloudFavoritesStorage.js"></script>
<script src="FavoritesStorageManager.js"></script>
<script src="favorites-client.js"></script>
<script src="favorites.js"></script>
<script src="identity.js"></script>
<script src="customer.js"></script>
<script src="CustomerClient.js"></script>
<script src="telegram-bridge.js"></script>
<script src="storage-local.js"></script>
<script src="storage-service.js"></script>
<script src="favorites-page.js"></script>
<script src="immersive.js"></script>
<script src="theme.js"></script>
<script src="daily-facts.js"></script>
<script src="daily-info.js"></script>
<script src="app.js"></script>

</body>
</html>
